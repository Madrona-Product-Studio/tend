<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG for modern browsers; PNG fallbacks for Safari (no SVG favicon support). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b23a2e" />

    <!-- Per-route titles/descriptions are set in the route components via React 19
         native document metadata. These are the site-wide defaults for crawlers. -->
    <title>GardenHQ — map and manage your garden</title>
    <meta
      name="description"
      content="GardenHQ helps home gardeners map, organize, and improve their food gardens year over year — a beautiful, spatially-true map of zones, beds, plants, and the systems that serve them."
    />
    <link rel="canonical" href="https://gardenhq.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GardenHQ" />
    <meta property="og:title" content="GardenHQ — map and manage your garden" />
    <meta property="og:description" content="A beautiful, spatially-true map of your food garden — zones, beds, plants, and the systems that serve them." />
    <meta property="og:url" content="https://gardenhq.app/" />
    <meta property="og:image" content="https://gardenhq.app/og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GardenHQ — map and manage your garden" />
    <meta name="twitter:description" content="A beautiful, spatially-true map of your food garden — zones, beds, plants, and the systems that serve them." />
    <meta name="twitter:image" content="https://gardenhq.app/og.png" />

    <!-- Fonts: Inter (swiss/zen sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD: the studio SEO standard's flagged gap — GardenHQ ships it from day one. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GardenHQ",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "description": "Map, organize, and improve your food garden year over year.",
        "url": "https://gardenhq.app/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <!-- Pre-hydration loading state: shown until React mounts and replaces it.
         Inline styles only (no bundle dependency); colors mirror the tokens. -->
    <div id="root">
      <div style="min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f5f1ea">
        <svg width="44" height="44" viewBox="0 0 100 100" fill="none" stroke="#b23a2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="animation:ghq-breathe 1.6s ease-in-out infinite" aria-hidden="true">
          <path d="M50 14 C30 36 30 64 50 86 C70 64 70 36 50 14 Z" />
          <path d="M50 20 L50 80" stroke-width="1.9" />
        </svg>
        <span style="font:600 11px/1 Inter,ui-sans-serif,system-ui,sans-serif;color:#6f6657;letter-spacing:0.16em;text-transform:uppercase">GardenHQ</span>
      </div>
      <style>
        @keyframes ghq-breathe { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
        @media (prefers-reduced-motion: reduce) { #root svg { animation: none !important } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
